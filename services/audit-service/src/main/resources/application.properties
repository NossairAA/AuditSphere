spring.application.name=audit-service
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/audit}
spring.datasource.username=${DB_USER:audit_runtime}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
server.error.include-message=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/auditsphere}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://localhost:8180/realms/auditsphere/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=auditsphere-api
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

outbox.enabled=${OUTBOX_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.linger.ms=0

temporal.enabled=${TEMPORAL_ENABLED:false}
temporal.target=${TEMPORAL_TARGET:localhost:7233}
temporal.namespace=${TEMPORAL_NAMESPACE:default}
# Keep Temporal retries from delaying the independent Kafka publisher.
spring.task.scheduling.pool.size=2
