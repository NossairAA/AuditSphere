spring.application.name=audit-service
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/audit}
spring.datasource.username=${DB_USER:audit}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/auditsphere}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://localhost:8180/realms/auditsphere/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=auditsphere-api
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
