spring.application.name=remediation-service
server.port=8083
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5548/remediation}
spring.datasource.username=${DB_USER:remediation_runtime}
spring.datasource.password=${DB_PASSWORD}
# Small pools for one or two users. Measured limits are documented in the k3s hosting guide.
spring.datasource.hikari.maximum-pool-size=5
server.tomcat.threads.max=50
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.jdbc.template.query-timeout=5s
server.error.include-message=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/auditsphere}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://localhost:8180/realms/auditsphere/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=auditsphere-api
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Traces are exported only when the k3s chart turns them on, on demand (phase 6, lot 6C).
management.tracing.export.enabled=false
remediation.time-zone=${REMEDIATION_TIME_ZONE:Europe/Paris}
# Issue synchronisation from audit-service (F-006 lot 3). The token comes from the remediation-service client.
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=20
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
# Only used to quarantine invalid records in the .DLT topics.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
# Attachments of corrective actions in their own Garage bucket (F-006 lot 5).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
remediation.s3.endpoint=${REMEDIATION_S3_ENDPOINT:}
remediation.s3.region=${REMEDIATION_S3_REGION:us-east-1}
remediation.s3.bucket=${REMEDIATION_S3_BUCKET:}
remediation.s3.access-key=${REMEDIATION_S3_ACCESS_KEY:}
remediation.s3.secret-key=${REMEDIATION_S3_SECRET_KEY:}
remediation.s3.path-style=${REMEDIATION_S3_PATH_STYLE:true}
remediation.mission-quota-bytes=${REMEDIATION_MISSION_QUOTA_BYTES:104857600}
