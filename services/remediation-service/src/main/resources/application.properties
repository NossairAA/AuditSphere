spring.application.name=remediation-service
server.port=8083
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5548/remediation}
spring.datasource.username=${DB_USER:remediation_runtime}
spring.datasource.password=${DB_PASSWORD}
# Small pools for one or two users. Measured limits are documented in the k3s hosting guide.
spring.datasource.hikari.maximum-pool-size=5
server.tomcat.threads.max=50
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.jdbc.template.query-timeout=5s
server.error.include-message=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/auditsphere}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://localhost:8180/realms/auditsphere/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=auditsphere-api
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
remediation.time-zone=${REMEDIATION_TIME_ZONE:Europe/Paris}
