# Requires provisioned HTTPS origins and a valid certificate, never started by start-local.sh.
services:
  web-db:
    ports: !reset []
  audit-db:
    ports: !reset []
  keycloak-db:
    ports: !reset []
  keycloak:
    command: [start, --import-realm, --https-certificate-file=/certs/tls.crt, --https-certificate-key-file=/certs/tls.key]
    ports: !override ["127.0.0.1:8443:8443"]
    environment:
      KC_HOSTNAME: ${PROD_OIDC_ORIGIN:?Set the public HTTPS identity origin}
      KC_HTTP_ENABLED: "false"
      KC_HOSTNAME_STRICT: "true"
    volumes:
      - ${KEYCLOAK_TLS_DIR:?Provide a private directory containing tls.crt and tls.key}:/certs:ro
  audit-service:
    environment:
      DIRECTORY_URL: ${PROD_OIDC_ORIGIN:?Set the HTTPS identity origin}
      OIDC_ISSUER: ${PROD_OIDC_ORIGIN}/realms/auditsphere
      OIDC_JWKS: ${PROD_OIDC_ORIGIN}/realms/auditsphere/protocol/openid-connect/certs
  api-gateway:
    environment:
      OIDC_ISSUER: ${PROD_OIDC_ORIGIN}/realms/auditsphere
      OIDC_JWKS: ${PROD_OIDC_ORIGIN}/realms/auditsphere/protocol/openid-connect/certs
