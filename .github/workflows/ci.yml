name: Build and permissions
# A change limited to image pins is checked by values.yml: rebuilding the images would only change their digests.
on:
  push:
    paths-ignore: [infra/helm/values/**, infra/helm/web/values.yaml]
  pull_request:
    paths-ignore: [infra/helm/values/**, infra/helm/web/values.yaml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 git /repo --redact --no-banner
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/init-local.py
      - run: python3 scripts/setup-web.py --configure-only
      - run: sh scripts/start-local.sh
      - run: python3 scripts/smoke.py
      - name: Verify Kafka delivery, redelivery and outage recovery
        run: python3 scripts/test-notifications.py --faults
      - name: Verify Temporal workflow and outage recovery
        run: python3 scripts/test-temporal.py --faults
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start web and test browser journeys
        run: sh scripts/test-browser-isolated.sh
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
  images:
    # Pull requests build and scan. Only main publishes, after the full verification.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [audit-service, api-gateway, notification-service, remediation-service, web]
    env:
      IMAGE_NAME: ${{ matrix.image }}
      TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image tagged with the commit SHA
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/auditsphere-$IMAGE_NAME:$GITHUB_SHA"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          label="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          if [ "$IMAGE_NAME" = web ]; then
            docker build --label "$label" -t "$image" apps/web
          else
            docker build --label "$label" --build-arg SERVICE="$IMAGE_NAME" -t "$image" .
          fi
      # The report and SBOM are uploaded first, so a blocked image still leaves its evidence.
      - name: Report fixable high and critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy -v "$PWD:/out" "$TRIVY" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json --output "/out/vulns-$IMAGE_NAME.json" --no-progress "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy "$TRIVY" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --skip-db-update --format table --no-progress -q "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate CycloneDX SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy -v "$PWD:/out" "$TRIVY" image --format cyclonedx --output "/out/sbom-$IMAGE_NAME.cdx.json" --no-progress "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-${{ matrix.image }}
          path: |
            sbom-${{ matrix.image }}.cdx.json
            vulns-${{ matrix.image }}.json
      - name: Block on fixable high and critical vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy "$TRIVY" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --skip-db-update --exit-code 1 --no-progress -q "$IMAGE"
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
  pin:
    # Writes the digests published by main into the Helm values, on a pull request opened by a GitHub App.
    # The GITHUB_TOKEN cannot open pull requests here, and its events would not start the required checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PIN_APP_CLIENT_ID != ''
    needs: images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    concurrency:
      group: pin-images
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Skip when main already holds newer sources
        run: |
          # Later runs pin newer images. Only pin commits that main has not changed since, outside the pins.
          if git diff --quiet "$GITHUB_SHA" HEAD -- . ':(exclude)infra/helm/values' ':(exclude)infra/helm/web/values.yaml'; then
            echo "STALE=false" >> "$GITHUB_ENV"
          else
            echo "STALE=true" >> "$GITHUB_ENV"
            echo "main moved past $GITHUB_SHA, a later run pins it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve published digests
        if: env.STALE == 'false'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for name in audit-service api-gateway notification-service remediation-service web; do
            digest=$(docker buildx imagetools inspect "ghcr.io/$owner/auditsphere-$name:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            printf -- '--digest %s=%s\n' "$name" "$digest" >> "$RUNNER_TEMP/digests"
          done
      - name: Pin images whose sources changed
        if: env.STALE == 'false'
        run: xargs python3 scripts/pin_images.py --sha "$GITHUB_SHA" < "$RUNNER_TEMP/digests" > "$RUNNER_TEMP/pins.md"
      - name: Open or update the pin pull request
        if: env.STALE == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if git diff --quiet; then
            echo "No image to pin." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$RUNNER_TEMP/pins.md" >> "$GITHUB_STEP_SUMMARY"
          bot="$APP_SLUG[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)+$bot@users.noreply.github.com"
          title="chore(deploy): pin images built from ${GITHUB_SHA::7}"
          git switch -C ci/pin-images
          git commit -qam "$title"
          git push --force origin ci/pin-images
          if [ -n "$(gh pr list --head ci/pin-images --state open --json number --jq '.[].number')" ]; then
            gh pr edit ci/pin-images --title "$title" --body-file "$RUNNER_TEMP/pins.md"
          else
            gh pr create --base main --head ci/pin-images --title "$title" --body-file "$RUNNER_TEMP/pins.md"
          fi
