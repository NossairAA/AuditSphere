name: Build and permissions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact --no-banner
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/init-local.py
      - run: python3 scripts/setup-web.py --configure-only
      - run: sh scripts/start-local.sh
      - run: python3 scripts/smoke.py
      - name: Verify Kafka delivery, redelivery and outage recovery
        run: python3 scripts/test-notifications.py --faults
      - name: Verify Temporal workflow and outage recovery
        run: python3 scripts/test-temporal.py --faults
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start web and test browser journeys
        run: sh scripts/test-browser-isolated.sh
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
