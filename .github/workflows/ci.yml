name: Build and permissions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact --no-banner
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: python3 scripts/init-local.py
      - run: python3 scripts/setup-web.py --configure-only
      - run: docker compose up -d --build
      - run: python3 scripts/setup-web.py
      - run: python3 scripts/smoke.py
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start web and test browser journeys
        run: |
          npm --prefix apps/web start > /tmp/auditsphere-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60)
          do
            if curl -fsS http://localhost:3000/ > /dev/null
            then
              break
            fi
            sleep 1
          done
          npm --prefix apps/web run test:e2e
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
