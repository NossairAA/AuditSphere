# Drop-in systemd de tailscaled, à installer sur l'hôte avec sudo (incident du 2026-10-29) :
#   /etc/systemd/system/tailscaled.service.d/runtime-directory.conf, puis systemctl daemon-reload.
# Sans ce réglage, systemd supprime /run/tailscale à chaque arrêt de tailscaled, par exemple pendant une
# mise à jour automatique. Le proxy TLS de Garage monte ce dossier et ne verrait jamais le nouveau socket.
[Service]
RuntimeDirectoryPreserve=yes
