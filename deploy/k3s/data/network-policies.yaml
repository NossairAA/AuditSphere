# Entrées de la couche de données (phase 8, lot A). Tout ce qui n'est pas listé est refusé.
# Les sondes du kubelet et kubectl exec ou port-forward ne passent pas par ces règles.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: temporal
        # Jobs d'amorçage des bases et du schéma Temporal.
        - podSelector:
            matchExpressions:
              - key: batch.kubernetes.io/job-name
                operator: In
                values: [postgres-bootstrap, temporal-schema]
        # Services, Keycloak, BFF et leurs Jobs de migration, qui portent le même nom d'application.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auditsphere
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [audit-service, notification-service, remediation-service, keycloak, web, web-schema]
        # Sauvegarde quotidienne, rôle en lecture seule (phase 7).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backup
          podSelector:
            matchLabels:
              app.kubernetes.io/name: backup
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auditsphere
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [audit-service, notification-service]
      ports:
        - port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: temporal
  policyTypes: [Ingress]
  ingress:
    # Le processus unique se joint lui-même par l'adresse du pod, sur ses ports internes.
    - from:
        - podSelector:
            matchLabels:
              app: temporal
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal-cli
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: temporal-namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auditsphere
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [audit-service, workflow-worker]
      ports:
        - port: 7233
