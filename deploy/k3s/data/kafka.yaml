# Kafka à un broker KRaft (ADR-0023, phase 3). Même image et mêmes topics que compose.yaml.
# Phase 8, lot D : SASL_SSL avec SCRAM-SHA-512 et ACL par service. Topics, comptes et ACL sont posés par
# scripts/k3s-kafka-security.sh. Le secret kafka-keystore-password est créé par ce script, hors dépôt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls
  namespace: data
spec:
  secretName: kafka-tls
  issuerRef:
    name: auditsphere-internal-ca
    kind: ClusterIssuer
  dnsNames:
    - kafka
    - kafka.data
    - kafka.data.svc
    - kafka.data.svc.cluster.local
    - kafka-0.kafka.data.svc.cluster.local
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  # L'image attend un magasin de clés et son mot de passe dans des fichiers.
  keystores:
    pkcs12:
      create: true
      profile: Modern2023
      passwordSecretRef:
        name: kafka-keystore-password
        key: password
---
# Côté serveur, SCRAM ne demande aucun secret : les empreintes des mots de passe sont dans les métadonnées KRaft.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jaas
  namespace: data
data:
  server.jaas: |
    KafkaServer {
      org.apache.kafka.common.security.scram.ScramLoginModule required;
    };
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: data
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: data
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Les variables KAFKA_* injectées pour le service kafka seraient lues comme des réglages du broker.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.0.2@sha256:836cafdad9f4825880d7cf1d5a21202915ae2527bd0ef1c3600c526ed7814d1f
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            # Seul SASL_SSL écoute sur le réseau. Le contrôleur et l'écoute locale des outils n'acceptent que
            # la boucle locale du pod : leur principal ANONYMOUS est super-utilisateur, sans accès réseau.
            - name: KAFKA_LISTENERS
              value: SASL_SSL://:9092,CONTROLLER://127.0.0.1:9093,LOCAL://127.0.0.1:9094
            - name: KAFKA_ADVERTISED_LISTENERS
              value: SASL_SSL://kafka.data.svc.cluster.local:9092,LOCAL://127.0.0.1:9094
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT,SASL_SSL:SASL_SSL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: LOCAL
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: SCRAM-SHA-512
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: org.apache.kafka.metadata.authorizer.StandardAuthorizer
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "false"
            - name: KAFKA_SUPER_USERS
              value: User:ANONYMOUS
            - name: KAFKA_OPTS
              value: -Djava.security.auth.login.config=/etc/kafka/jaas/server.jaas
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_FILENAME
              value: keystore.p12
            - name: KAFKA_SSL_KEYSTORE_CREDENTIALS
              value: keystore-password
            - name: KAFKA_SSL_KEY_CREDENTIALS
              value: keystore-password
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # Sept jours au plus, et 256 Mio au plus par partition.
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "268435456"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "67108864"
            - name: CLUSTER_ID
              value: CF9re3IETN-2u83vX9lyOA
            - name: KAFKA_HEAP_OPTS
              value: -Xms128m -Xmx256m
          ports:
            - name: broker
              containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: secrets
              mountPath: /etc/kafka/secrets
              readOnly: true
            - name: jaas
              mountPath: /etc/kafka/jaas
              readOnly: true
      volumes:
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: kafka-tls
                  items:
                    - key: keystore.p12
                      path: keystore.p12
              - secret:
                  name: kafka-keystore-password
                  items:
                    - key: password
                      path: keystore-password
        - name: jaas
          configMap:
            name: kafka-jaas
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
