# cert-manager pour l'autorité interne (phase 8, lot B, ADR-0026), installé par le contrôleur Helm de k3s.
# La racine reste hors du serveur. Seule l'autorité intermédiaire est chargée par scripts/k3s-internal-ca.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Aucun pod ne doit joindre cert-manager. Le webhook est appelé par l'API de k3s depuis le nœud, hors de ces règles.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: oci://quay.io/jetstack/charts/cert-manager
  version: v1.21.3
  targetNamespace: cert-manager
  valuesContent: |-
    crds:
      enabled: true
      keep: true
    prometheus:
      enabled: false
    # Le contrôle de démarrage lance un Job à chaque mise à jour : inutile ici.
    startupapicheck:
      enabled: false
    # Supprimer un Certificate supprime aussi son secret : aucune clé orpheline ne reste dans le cluster.
    enableCertificateOwnerRef: true
    image:
      repository: quay.io/jetstack/cert-manager-controller
      digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
    webhook:
      image:
        repository: quay.io/jetstack/cert-manager-webhook
        digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
    cainjector:
      image:
        repository: quay.io/jetstack/cert-manager-cainjector
        digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
    # Solveur ACME jamais utilisé, épinglé pour qu'aucune image flottante ne soit référencée.
    acmesolver:
      image:
        repository: quay.io/jetstack/cert-manager-acmesolver
        digest: sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
