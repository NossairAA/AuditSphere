# CLI Temporal éphémère pour les scripts de vérification, créé et supprimé par scripts/k3s-check.sh.
# L'image du serveur ne contient pas la CLI. Aucun secret : Temporal n'a pas encore d'authentification (phase 8).
apiVersion: v1
kind: Pod
metadata:
  name: temporal-cli
  namespace: data
  labels:
    app.kubernetes.io/name: temporal-cli
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: cli
      image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
      command: [sleep, "3600"]
      env:
        - name: TEMPORAL_ADDRESS
          value: temporal.data.svc.cluster.local:7233
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
