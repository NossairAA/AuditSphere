# Règles d'entrée d'une session d'observation (phase 6, lot 6C, ADR-0030), appliquées et retirées par
# scripts/k3s-observability.sh. Le namespace monitoring refuse toute entrée par défaut (lot 6A).
# Traces : les pods du namespace auditsphere vers l'OTLP en HTTP de Tempo. Requêtes : Grafana seul.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-tempo
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auditsphere
      ports:
        - port: 4318
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 3200
---
# Journaux : Alloy pousse, Grafana interroge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-loki
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 3100
---
# Grafana interroge Prometheus pendant la session.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
