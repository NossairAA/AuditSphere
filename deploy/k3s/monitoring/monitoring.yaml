# Supervision (phase 6, lot 6A, ADR-0029) : Prometheus, Alertmanager, node-exporter, kube-state-metrics et sondes blackbox.
# Les secrets d'alerte et les cibles propres au tailnet sont créés par scripts/k3s-monitoring.sh, jamais dans Git.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter lit /proc et /sys de l'hôte avec le réseau de l'hôte : niveau privileged pour ce seul namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Prometheus seul interroge Alertmanager, kube-state-metrics et les sondes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [alertmanager, kube-state-metrics, prometheus-blackbox-exporter]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - port: 9093
        - port: 8080
        - port: 8081
        - port: 9115
---
# Sondes de disponibilité : la bordure et Keycloak, depuis l'exportateur blackbox seul.
# La gateway est sondée sur son port de gestion, ouvert par le chart spring-service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-monitoring-probes
  namespace: auditsphere
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [edge, keycloak]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-blackbox-exporter
      ports:
        - port: 8000
        - port: 8080
---
# Métriques de la bordure Traefik et de Keycloak (lot 6B), depuis Prometheus seul. Les services Spring
# déclarent leur propre règle pour leur port de gestion dans le chart spring-service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-prometheus
  namespace: auditsphere
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [edge, keycloak]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - port: 8082
        - port: 9000
---
# Métriques de cert-manager, dont l'expiration des certificats. Ses trois pods les exposent sur 9402.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-prometheus
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9402
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: blackbox
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: prometheus-blackbox-exporter
  version: 11.20.0
  targetNamespace: monitoring
  valuesContent: |-
    fullnameOverride: blackbox-exporter
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 48Mi}
    config:
      modules:
        # Réponse attendue sans suivre de redirection : la page de connexion peut rediriger.
        http_up:
          prober: http
          timeout: 10s
          http:
            follow_redirects: false
            valid_status_codes: [200, 301, 302, 303, 307, 308]
            preferred_ip_protocol: ip4
        # Garage répond 403 sans signature : seul le service et son certificat sont vérifiés.
        https_garage:
          prober: http
          timeout: 10s
          http:
            valid_status_codes: [403]
            fail_if_not_ssl: true
            preferred_ip_protocol: ip4
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: prometheus
  version: 29.36.0
  targetNamespace: monitoring
  valuesContent: |-
    prometheus-pushgateway:
      enabled: false
    # k3s sert toutes ses métriques internes, environ 43 000 séries, à la fois sur l'API et sur le kubelet.
    # Seule la disponibilité de ces deux cibles est gardée. Le kubelet reste lu par cAdvisor pour les conteneurs.
    scrapeConfigs:
      kubernetes-api-servers:
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: .+
            action: drop
      kubernetes-nodes:
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: .+
            action: drop
    server:
      retention: 2d
      retentionSize: 1GB
      global:
        scrape_interval: 1m
        evaluation_interval: 1m
      persistentVolume:
        size: 2Gi
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 448Mi}
      # Cibles propres au tailnet, comme Garage, écrites par scripts/k3s-monitoring.sh.
      extraSecretMounts:
        - name: private-targets
          mountPath: /etc/prometheus-private
          secretName: prometheus-private-targets
          readOnly: true
    configmapReload:
      prometheus:
        resources:
          requests: {cpu: 1m, memory: 8Mi}
          limits: {memory: 32Mi}
    kube-state-metrics:
      resources:
        requests: {cpu: 5m, memory: 48Mi}
        limits: {memory: 96Mi}
    prometheus-node-exporter:
      resources:
        requests: {cpu: 5m, memory: 24Mi}
        limits: {memory: 48Mi}
    alertmanager:
      persistence:
        size: 256Mi
      resources:
        requests: {cpu: 5m, memory: 32Mi}
        limits: {memory: 64Mi}
      configmapReload:
        resources:
          requests: {cpu: 1m, memory: 8Mi}
          limits: {memory: 32Mi}
      extraSecretMounts:
        - name: ntfy
          mountPath: /etc/alertmanager-ntfy
          secretName: alertmanager-ntfy
          readOnly: true
      config:
        route:
          receiver: ntfy
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          routes:
            - matchers: ['severity="critical"']
              receiver: ntfy-urgent
              repeat_interval: 1h
        receivers:
          # Les adresses contiennent le sujet ntfy, qui sert de secret : elles sont lues dans un fichier.
          - name: ntfy
            webhook_configs:
              - url_file: /etc/alertmanager-ntfy/url
                send_resolved: true
          - name: ntfy-urgent
            webhook_configs:
              - url_file: /etc/alertmanager-ntfy/url-urgent
                send_resolved: true
        inhibit_rules:
          # Une application injoignable explique les sondes qui échouent derrière elle.
          - source_matchers: ['alertname="NodeDown"']
            target_matchers: ['alertname=~"ProbeFailed|TargetDown"']
    extraScrapeConfigs: |
      # Les échecs d'envoi d'Alertmanager alimentent l'alerte AlertmanagerNotificationsFailing.
      - job_name: alertmanager
        static_configs:
          - targets: [prometheus-alertmanager:9093]
      - job_name: blackbox
        metrics_path: /probe
        params:
          module: [http_up]
        static_configs:
          - targets:
              - http://edge.auditsphere.svc/
              # Port de gestion de la gateway (lot 6B), ouvert à la supervision par le chart spring-service.
              - http://api-gateway.auditsphere.svc:9464/actuator/health/readiness
              # Le service Keycloak n'expose pas le port de santé : le document de découverte OIDC du royaume sert de sonde.
              - http://keycloak.auditsphere.svc:8080/realms/auditsphere/.well-known/openid-configuration
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
      - job_name: blackbox-garage
        metrics_path: /probe
        params:
          module: [https_garage]
        file_sd_configs:
          - files: [/etc/prometheus-private/garage.json]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: instance
            replacement: garage
          - target_label: __address__
            replacement: blackbox-exporter:9115
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: hote
            rules:
              - alert: NodeDiskAlmostFull
                expr: 1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} > 0.85
                for: 10m
                labels: {severity: critical}
                annotations:
                  summary: Disque racine de l'hôte rempli à plus de 85 %
                  description: "Occupation : {{ $value | humanizePercentage }}."
              - alert: NodeMemoryLow
                expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
                for: 10m
                labels: {severity: critical}
                annotations:
                  summary: Moins de 10 % de mémoire disponible sur l'hôte
                  description: "Disponible : {{ $value | humanizePercentage }}."
              - alert: NodeSwapHigh
                expr: node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes > 1073741824
                for: 15m
                labels: {severity: warning}
                annotations:
                  summary: Plus de 1 Gio d'échange utilisé sur l'hôte
                  description: "Échange utilisé : {{ $value | humanize1024 }}o."
              - alert: NodeLoadHigh
                expr: node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 0.9
                for: 15m
                labels: {severity: warning}
                annotations:
                  summary: Charge de l'hôte supérieure à 90 % des cœurs depuis 15 minutes
                  description: "Charge par cœur : {{ $value | humanize }}."
              - alert: NodeDown
                expr: up{job="kubernetes-service-endpoints",service=~".*node-exporter.*"} == 0
                for: 5m
                labels: {severity: critical}
                annotations:
                  summary: node-exporter ne répond plus
                  description: Les métriques de l'hôte ne sont plus collectées.
          - name: kubernetes
            rules:
              - alert: ContainerOOMKilled
                expr: (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1) and on (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m]) > 0)
                labels: {severity: warning}
                annotations:
                  summary: "Conteneur {{ $labels.namespace }}/{{ $labels.container }} arrêté par manque de mémoire"
                  description: "Pod {{ $labels.pod }}."
              - alert: PodRestartingOften
                expr: increase(kube_pod_container_status_restarts_total[1h]) >= 3
                labels: {severity: warning}
                annotations:
                  summary: "Conteneur {{ $labels.namespace }}/{{ $labels.container }} redémarré au moins trois fois en une heure"
                  description: "Pod {{ $labels.pod }}."
              - alert: PodCrashLooping
                expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
                for: 5m
                labels: {severity: critical}
                annotations:
                  summary: "Conteneur {{ $labels.namespace }}/{{ $labels.container }} en CrashLoopBackOff"
                  description: "Pod {{ $labels.pod }}."
              - alert: WorkloadUnavailable
                expr: |
                  (kube_deployment_status_replicas_available < kube_deployment_spec_replicas)
                  or (kube_statefulset_status_replicas_ready < kube_statefulset_replicas)
                for: 10m
                labels: {severity: critical}
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.deployment }}{{ $labels.statefulset }} sans toutes ses répliques prêtes"
                  description: Depuis plus de 10 minutes.
              - alert: JobFailed
                expr: kube_job_status_failed > 0
                labels: {severity: warning}
                annotations:
                  summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} en échec"
                  description: Un échec reste signalé tant que le Job existe.
              - alert: BackupTooOld
                expr: time() - kube_cronjob_status_last_successful_time{namespace="backup"} > 26 * 3600
                labels: {severity: critical}
                annotations:
                  summary: Aucune sauvegarde réussie depuis plus de 26 heures
                  description: "CronJob {{ $labels.cronjob }}."
          - name: certificats
            rules:
              - alert: CertificateExpiringSoon
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
                for: 1h
                labels: {severity: warning}
                annotations:
                  summary: "Certificat {{ $labels.namespace }}/{{ $labels.name }} expire dans moins de 14 jours"
                  description: cert-manager aurait dû le renouveler.
              - alert: CertificateNotReady
                expr: certmanager_certificate_ready_status{condition="True"} == 0
                for: 15m
                labels: {severity: critical}
                annotations:
                  summary: "Certificat {{ $labels.namespace }}/{{ $labels.name }} non prêt"
                  description: Depuis plus de 15 minutes.
          - name: disponibilite
            rules:
              - alert: ProbeFailed
                expr: probe_success == 0
                for: 3m
                labels: {severity: critical}
                annotations:
                  summary: "Sonde en échec : {{ $labels.instance }}"
                  description: Depuis plus de 3 minutes.
              - alert: TargetDown
                expr: up == 0
                for: 10m
                labels: {severity: warning}
                annotations:
                  summary: "Cible {{ $labels.job }} injoignable : {{ $labels.instance }}"
                  description: Depuis plus de 10 minutes.
          # Compteurs : une série apparue dans la fenêtre compte pour sa valeur entière, car increase()
          # ignore la première valeur d'une série. Sans cela, la première rafale d'une attaque passerait inaperçue.
          - name: applications
            rules:
              - alert: JvmHeapHigh
                expr: sum by (application) (jvm_memory_used_bytes{area="heap"}) / sum by (application) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
                for: 15m
                labels: {severity: warning}
                annotations:
                  summary: "Tas de {{ $labels.application }} occupé à plus de 90 %"
                  description: "Occupation : {{ $value | humanizePercentage }}."
              - alert: HttpServerErrors
                expr: sum by (application) ((http_server_requests_seconds_count{status=~"5.."} unless http_server_requests_seconds_count offset 10m) or increase(http_server_requests_seconds_count{status=~"5.."}[10m])) >= 10
                labels: {severity: warning}
                annotations:
                  summary: "{{ $labels.application }} a renvoyé au moins 10 erreurs 5xx en 10 minutes"
                  description: "Erreurs : {{ $value | humanize }}."
              - alert: KafkaConsumerLag
                expr: max by (application, topic) (kafka_consumer_fetch_manager_records_lag_max) > 100
                for: 10m
                labels: {severity: warning}
                annotations:
                  summary: "Retard de {{ $labels.application }} sur {{ $labels.topic }}"
                  description: "Retard maximal : {{ $value | humanize }} messages."
              - alert: KafkaDeadLetter
                expr: sum by (application, topic) ((kafka_producer_topic_record_send_total{topic=~".+[.]DLT"} unless kafka_producer_topic_record_send_total offset 15m) or increase(kafka_producer_topic_record_send_total{topic=~".+[.]DLT"}[15m])) > 0
                labels: {severity: warning}
                annotations:
                  summary: "Message envoyé en DLT : {{ $labels.topic }}"
                  description: Un message n'a pas pu être traité et attend une reprise manuelle.
              - alert: OutboxStuck
                expr: auditsphere_outbox_oldest_age_seconds > 600
                for: 5m
                labels: {severity: critical}
                annotations:
                  summary: "Outbox {{ $labels.outbox }} bloquée depuis plus de 10 minutes"
                  description: "Événement le plus ancien en attente : {{ $value | humanizeDuration }}."
          - name: abus
            rules:
              - alert: EdgeRateLimited
                expr: sum((traefik_entrypoint_requests_total{entrypoint="web",code="429"} unless traefik_entrypoint_requests_total offset 5m) or increase(traefik_entrypoint_requests_total{entrypoint="web",code="429"}[5m])) > 50
                labels: {severity: warning}
                annotations:
                  summary: Plus de 50 requêtes refusées par la limite de débit de la bordure en 5 minutes
                  description: "Refus : {{ $value | humanize }}."
              - alert: EdgeTrafficSpike
                expr: sum(rate(traefik_entrypoint_requests_total{entrypoint="web"}[5m])) > 20
                for: 10m
                labels: {severity: warning}
                annotations:
                  summary: Plus de 20 requêtes par seconde sur la bordure depuis 10 minutes
                  description: "Débit : {{ $value | humanize }} requêtes par seconde."
              - alert: LoginFailures
                expr: sum by (realm) ((keycloak_user_events_total{event="login",error!=""} unless keycloak_user_events_total offset 10m) or increase(keycloak_user_events_total{event="login",error!=""}[10m])) > 20
                labels: {severity: warning}
                annotations:
                  summary: "Plus de 20 échecs de connexion en 10 minutes sur {{ $labels.realm }}"
                  description: "Échecs : {{ $value | humanize }}."
              - alert: GatewayAuthRejections
                expr: sum((http_server_requests_seconds_count{application="api-gateway",status=~"401|403|429"} unless http_server_requests_seconds_count offset 10m) or increase(http_server_requests_seconds_count{application="api-gateway",status=~"401|403|429"}[10m])) > 50
                labels: {severity: warning}
                annotations:
                  summary: Plus de 50 réponses 401, 403 ou 429 de la gateway en 10 minutes
                  description: "Réponses : {{ $value | humanize }}."
          - name: supervision
            rules:
              - alert: AlertmanagerNotificationsFailing
                expr: increase(alertmanager_notifications_failed_total[15m]) > 0
                labels: {severity: warning}
                annotations:
                  summary: Alertmanager n'arrive pas à envoyer des alertes
                  description: "Intégration {{ $labels.integration }}."
