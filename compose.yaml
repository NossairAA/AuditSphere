name: auditsphere
services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: [/garage, server, --single-node]
    ports: ["127.0.0.1:3900:3900"]
    volumes:
      - ./.local/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped
  temporal-storage:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    user: "0:0"
    entrypoint: [sh, -ec]
    command: ["chown 1000:1000 /data && chmod 700 /data"]
    volumes: [temporal-data:/data]
    restart: "no"
  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: [server, start-dev, --ip, 0.0.0.0, --db-filename, /data/temporal.db]
    ports: ["127.0.0.1:8233:8233"]
    volumes: [temporal-data:/data]
    depends_on:
      temporal-storage: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, localhost:7233]
      interval: 5s
      timeout: 5s
      retries: 30
  workflow-worker:
    mem_limit: 256m
    image: auditsphere-audit-service:local
    environment:
      WORKFLOW_WORKER_ONLY: "true"
      TEMPORAL_TARGET: temporal:7233
    depends_on:
      temporal: {condition: service_healthy}
    restart: unless-stopped
  kafka-storage:
    image: apache/kafka:4.0.2@sha256:836cafdad9f4825880d7cf1d5a21202915ae2527bd0ef1c3600c526ed7814d1f
    user: "0:0"
    entrypoint: [sh, -ec]
    command: ["chown 1000:1000 /data && chmod 700 /data"]
    volumes: [kafka-data:/data]
    restart: "no"
  kafka:
    image: apache/kafka:4.0.2@sha256:836cafdad9f4825880d7cf1d5a21202915ae2527bd0ef1c3600c526ed7814d1f
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    depends_on:
      kafka-storage: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
  kafka-init:
    image: apache/kafka:4.0.2@sha256:836cafdad9f4825880d7cf1d5a21202915ae2527bd0ef1c3600c526ed7814d1f
    entrypoint: [sh, -ec]
    command:
      - |
        for topic in audit.mission.assigned.v1 audit.mission.review-requested.v1 audit.mission.findings-issued.v1 audit.mission.findings-withdrawn.v1 audit.mission.assigned.v1.DLT audit.mission.review-requested.v1.DLT audit.mission.findings-issued.v1.DLT audit.mission.findings-withdrawn.v1.DLT
        do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=604800000
        done
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
  notification-db:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run python3 scripts/prepare-notifications.py}
    ports: ["127.0.0.1:5547:5432"]
    volumes: [notification-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U notification -d notification"]
      interval: 5s
      retries: 20
  notification-service:
    mem_limit: 320m
    build:
      context: .
      args: {SERVICE: notification-service}
    environment:
      AUDIT_URL: http://audit-service:8081
      DB_URL: jdbc:postgresql://notification-db:5432/notification
      DB_USER: notification_runtime
      DB_PASSWORD: ${NOTIFICATION_RUNTIME_PASSWORD:-not-provisioned}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_ISSUER: http://localhost:8180/realms/auditsphere
      OIDC_JWKS: http://keycloak:8080/realms/auditsphere/protocol/openid-connect/certs
    depends_on:
      notification-db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
  remediation-db:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    environment:
      POSTGRES_DB: remediation
      POSTGRES_USER: remediation
      POSTGRES_PASSWORD: ${REMEDIATION_DB_PASSWORD:?Run python3 scripts/prepare-remediation.py}
    ports: ["127.0.0.1:5548:5432"]
    volumes: [remediation-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U remediation -d remediation"]
      interval: 5s
      retries: 20
  remediation-service:
    mem_limit: 320m
    build:
      context: .
      args: {SERVICE: remediation-service}
    environment:
      AUDIT_URL: http://audit-service:8081
      DB_URL: jdbc:postgresql://remediation-db:5432/remediation
      DB_USER: remediation_runtime
      DB_PASSWORD: ${REMEDIATION_RUNTIME_PASSWORD:-not-provisioned}
      OIDC_ISSUER: http://localhost:8180/realms/auditsphere
      OIDC_JWKS: http://keycloak:8080/realms/auditsphere/protocol/openid-connect/certs
    depends_on:
      remediation-db: {condition: service_healthy}
      keycloak: {condition: service_started}
  web-db:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    environment:
      POSTGRES_DB: web
      POSTGRES_USER: web
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:?Run python3 scripts/setup-web.py}
    ports: ["127.0.0.1:5544:5432"]
    volumes:
      - web-data:/var/lib/postgresql/data
      - ./apps/web/db/001-sessions.sql:/docker-entrypoint-initdb.d/001-sessions.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U web -d web"]
      interval: 5s
      retries: 20
  audit-db:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?Run python3 scripts/init-local.py}
    ports: ["127.0.0.1:5545:5432"]
    volumes: [audit-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U audit -d audit"]
      interval: 5s
      retries: 20
  keycloak-db:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run init-local}
    ports: ["127.0.0.1:5546:5432"]
    volumes: [identity-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20
  keycloak-import:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command:
      - cp /source/realm.json /target/auditsphere-realm.json && chown 1000:0 /target/auditsphere-realm.json && chmod 600 /target/auditsphere-realm.json
    volumes:
      - ./.local/realm.json:/source/realm.json:ro
      - realm-import:/target
    restart: "no"
  keycloak:
    mem_limit: 640m
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: [start-dev, --import-realm]
    ports: ["127.0.0.1:8180:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak # gitleaks:allow (adresse sans identifiant ni secret)
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run init-local}
      KC_HOSTNAME: http://localhost:8180
      # Leaves room for metaspace and threads under the 640m limit.
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=55 -XX:InitialRAMPercentage=25
    volumes: [realm-import:/opt/keycloak/data/import:ro]
    depends_on:
      keycloak-db: {condition: service_healthy}
      keycloak-import: {condition: service_completed_successfully}
  audit-service:
    # Hibernate, Kafka, Temporal and the S3 client need about 140 MiB outside the heap.
    mem_limit: 448m
    image: auditsphere-audit-service:local
    build:
      context: .
      args: {SERVICE: audit-service}
    environment:
      DB_URL: jdbc:postgresql://audit-db:5432/audit
      DB_USER: audit_runtime
      DB_PASSWORD: ${AUDIT_RUNTIME_PASSWORD:-not-provisioned}
      SPRING_FLYWAY_ENABLED: "false"
      OUTBOX_ENABLED: "true"
      TEMPORAL_ENABLED: "true"
      TEMPORAL_TARGET: temporal:7233
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DIRECTORY_URL: http://keycloak:8080
      USER_ADMIN_CLIENT_SECRET: ${USER_ADMIN_CLIENT_SECRET:-not-provisioned}
      USER_ADMIN_LOCAL_EMAIL_FALLBACK: "true"
      DIRECTORY_CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:?Run setup-web.py --configure-only}
      OIDC_ISSUER: http://localhost:8180/realms/auditsphere
      OIDC_JWKS: http://keycloak:8080/realms/auditsphere/protocol/openid-connect/certs
      EVIDENCE_S3_ENDPOINT: ${EVIDENCE_S3_ENDPOINT:-http://garage:3900}
      EVIDENCE_S3_REGION: garage
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-auditsphere-evidence}
      EVIDENCE_S3_ACCESS_KEY: ${EVIDENCE_S3_ACCESS_KEY:-not-provisioned}
      EVIDENCE_S3_SECRET_KEY: ${EVIDENCE_S3_SECRET_KEY:-not-provisioned}
      EVIDENCE_S3_PATH_STYLE: "true"
    depends_on:
      audit-db: {condition: service_healthy}
      keycloak: {condition: service_started}
  api-gateway:
    mem_limit: 384m
    build:
      context: .
      args: {SERVICE: api-gateway}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      GATEWAY_RATE_IP_LIMIT: ${GATEWAY_RATE_IP_LIMIT:-1200}
      AUDIT_URL: http://audit-service:8081
      NOTIFICATION_URL: http://notification-service:8082
      REMEDIATION_URL: http://remediation-service:8083
      OIDC_ISSUER: http://localhost:8180/realms/auditsphere
      OIDC_JWKS: http://keycloak:8080/realms/auditsphere/protocol/openid-connect/certs
    depends_on: [audit-service, notification-service, remediation-service]
volumes:
  garage-meta:
  garage-data:
  temporal-data:
  kafka-data:
  notification-data:
  remediation-data:
  realm-import:
  web-data:
  audit-data:
  identity-data:
