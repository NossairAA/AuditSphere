image:
  repository: ghcr.io/nossairaa/auditsphere-web
  tag: 41c1c944bd98b71ff2ff8c945bee9abd3f8d9f0f
  digest: sha256:5e4f76e37c1fa0470ddc8a033c27abb74ae4821ef47da61c73533cefa69211e1

# Origines HTTPS du tailnet, passées à l'installation depuis .local/k3s.env.
appOrigin: ""
oidcOrigin: ""
oidcClientId: auditsphere-web
apiOrigin: http://api-gateway.auditsphere.svc.cluster.local:8080

# Adresse du visiteur pour les limites du BFF. Par le tunnel, Cloudflare écrase cf-connecting-ip.
# Par le tailnet, Traefik pose x-real-ip. La liste exige l'image de 04baf82 ou plus récente (phase 10, lot B).
trustedProxyIpHeaders: cf-connecting-ip,x-real-ip

# Profil demo (ADR-0031) : boutons d'entrée en un clic et bandeau. Passé à l'installation depuis AUDITSPHERE_PROFILE.
demo:
  enabled: false

# Schéma des sessions, passé par --set-file depuis apps/web/db.
sessionsSql: ""
encryptedSessionsSql: ""
database:
  host: postgres.data.svc.cluster.local
  name: web

# Racine hors ligne (ADR-0026), montée en /etc/auditsphere/ca. Le BFF et le Job de schéma
# joignent PostgreSQL en TLS vérifié (phase 8, lot C).
internalCa:
  configMap: internal-ca

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 192Mi

edge:
  image:
    repository: traefik
    tag: v3.7.16
    digest: sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
  # Nom de l'entrée Tailscale. Il devient public dans les journaux Certificate Transparency.
  ingressHost: app
  # Requêtes par seconde et rafale, par valeur de clientIpHeader.
  rateAverage: 50
  rateBurst: 100
  # Derrière le tunnel, l'adresse source vue par Traefik est celle de cloudflared. Cloudflare écrase
  # Cf-Connecting-Ip avec l'adresse réelle du visiteur. Par le tailnet, l'en-tête manque et la limite est commune.
  clientIpHeader: Cf-Connecting-Ip
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 96Mi

psqlImage: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
