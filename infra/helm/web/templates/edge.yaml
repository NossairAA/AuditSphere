# Traefik en bordure, joignable seulement par le proxy de l'entrée Tailscale app.
# Il écrase X-Real-Ip, limite le débit et ajoute les en-têtes de sécurité avant le BFF.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-config
data:
  traefik.yml: |
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    entryPoints:
      web:
        address: ":8000"
        forwardedHeaders:
          trustedIPs: ["10.42.0.0/16"]
      ping:
        address: ":8082"
    ping:
      entryPoint: ping
    providers:
      file:
        filename: /etc/traefik/dynamic.yml
    log:
      level: INFO
    accessLog: {}
  dynamic.yml: |
    http:
      routers:
        app:
          entryPoints: [web]
          rule: PathPrefix(`/`)
          service: web
          middlewares: [rate-limit, security-headers]
      middlewares:
        rate-limit:
          rateLimit:
            average: {{ .Values.edge.rateAverage }}
            burst: {{ .Values.edge.rateBurst }}
        security-headers:
          headers:
            stsSeconds: 31536000
            contentTypeNosniff: true
            frameDeny: true
            referrerPolicy: same-origin
      services:
        web:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://web.{{ .Release.Namespace }}.svc.cluster.local:3000
---
apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 80
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: auditsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
        app.kubernetes.io/part-of: auditsphere
      annotations:
        checksum/config: {{ printf "%v%v%v" .Values.edge.rateAverage .Values.edge.rateBurst .Release.Namespace | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: {{ .Values.edge.image.repository }}:{{ .Values.edge.image.tag }}@{{ required "edge.image.digest est obligatoire" .Values.edge.image.digest }}
          args: [--configFile=/etc/traefik/traefik.yml]
          ports:
            - name: web
              containerPort: 8000
            - name: ping
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: ping
            periodSeconds: 20
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edge-config
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-only-from-tailscale
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: edge
      port:
        number: 80
  tls:
    - hosts:
        - {{ .Values.edge.ingressHost }}
