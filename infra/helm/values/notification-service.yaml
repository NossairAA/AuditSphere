image:
  repository: ghcr.io/nossairaa/auditsphere-notification-service
  tag: 788e3c8fbc7dc6d6b18d8bcec315b60d9983aa90
  digest: sha256:1b2fa69781d7f4f5947b518d13ee966d9b5266ff58978ba0b27f81c16c015091
port: 8082
# Actuator et métriques Prometheus sur un port réservé à la supervision (phase 6, lot 6B).
managementPort: 9464
allowFrom:
  - api-gateway
oidc:
  enabled: true
env:
  AUDIT_URL: http://audit-service.auditsphere.svc.cluster.local:8081
  # TLS vérifié contre la racine hors ligne (phase 8, lot C).
  DB_URL: jdbc:postgresql://postgres.data.svc.cluster.local:5432/notification?sslmode=verify-full&sslrootcert=/etc/auditsphere/ca/ca.crt
  DB_USER: notification_runtime
  KAFKA_BOOTSTRAP_SERVERS: kafka.data.svc.cluster.local:9092
  # SASL_SSL avec SCRAM-SHA-512 et TLS vérifié contre la racine hors ligne (phase 8, lot D).
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
  SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
  SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/auditsphere/ca/ca.crt
secretEnv:
  - {name: DB_PASSWORD, secret: db-credentials, key: notification_runtime}
  - {name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG, secret: kafka-notification-service, key: jaas}
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 320Mi
internalCa:
  enabled: true

migration:
  enabled: true
  database: notification
  user: notification_migrator
  grants: |
    REVOKE ALL ON ALL TABLES IN SCHEMA public FROM notification_runtime;
    GRANT SELECT, INSERT ON notifications TO notification_runtime;
    GRANT UPDATE (read_at) ON notifications TO notification_runtime;
