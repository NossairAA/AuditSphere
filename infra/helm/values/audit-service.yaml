image:
  repository: ghcr.io/nossairaa/auditsphere-audit-service
  tag: 3066fbc197fd78094729f691fefdb215cc4620a2
  digest: sha256:7abc305c3a2fcf01942e4cbdc68e6b09c6fb9bb9aa3b9cc3bf825925e8e6bd8d
port: 8081
# Actuator et métriques Prometheus sur un port réservé à la supervision (phase 6, lot 6B).
managementPort: 9464
allowFrom:
  - api-gateway
  - notification-service
  - remediation-service
oidc:
  enabled: true
env:
  # TLS vérifié contre la racine hors ligne (phase 8, lot C).
  DB_URL: jdbc:postgresql://postgres.data.svc.cluster.local:5432/audit?sslmode=verify-full&sslrootcert=/etc/auditsphere/ca/ca.crt
  DB_USER: audit_runtime
  SPRING_FLYWAY_ENABLED: "false"
  OUTBOX_ENABLED: "true"
  TEMPORAL_ENABLED: "true"
  TEMPORAL_TARGET: temporal.data.svc.cluster.local:7233
  KAFKA_BOOTSTRAP_SERVERS: kafka.data.svc.cluster.local:9092
  # SASL_SSL avec SCRAM-SHA-512 et TLS vérifié contre la racine hors ligne (phase 8, lot D).
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
  SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
  SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/auditsphere/ca/ca.crt
  DIRECTORY_URL: http://keycloak.auditsphere.svc.cluster.local:8080
  # Profil de démonstration : pas de serveur de messagerie.
  USER_ADMIN_LOCAL_EMAIL_FALLBACK: "true"
  EVIDENCE_S3_REGION: garage
  EVIDENCE_S3_BUCKET: auditsphere-evidence-k3s
  EVIDENCE_S3_PATH_STYLE: "true"
  # EVIDENCE_S3_ENDPOINT est passé à l'installation depuis .local/k3s.env.
  # Tas à 50 % de la limite au lieu des 60 % de l'image : environ 384 Mio, le reste pour le hors-tas (2026-10-28).
  JAVA_TOOL_OPTIONS: -XX:+UseSerialGC -XX:MaxRAMPercentage=50 -Xss512k
secretEnv:
  - {name: DB_PASSWORD, secret: db-credentials, key: audit_runtime}
  - {name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG, secret: kafka-audit-service, key: jaas}
  - {name: DIRECTORY_CLIENT_SECRET, secret: app-secrets, key: DIRECTORY_CLIENT_SECRET}
  - {name: USER_ADMIN_CLIENT_SECRET, secret: app-secrets, key: USER_ADMIN_CLIENT_SECRET}
  - {name: EVIDENCE_S3_ACCESS_KEY, secret: evidence-s3, key: EVIDENCE_S3_ACCESS_KEY}
  - {name: EVIDENCE_S3_SECRET_KEY, secret: evidence-s3, key: EVIDENCE_S3_SECRET_KEY}
# Hibernate, Kafka, Temporal et le client S3 demandent environ 140 Mio hors du tas.
# 448 Mio suffisaient sans le port de gestion. Avec lui et le registre Prometheus, le conteneur a atteint
# sa limite et a été arrêté le 2026-10-27 (phase 6, lot 6B) : 64 Mio de plus.
# Le 2026-10-28, le conteneur restait à 505 Mio sur 512 au repos et a été arrêté par OOM pendant le
# seed de demo-reset. Hors du tas, il mesure environ 300 Mio en k3s : limite à 768 Mio.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 768Mi
internalCa:
  enabled: true

temporalTls:
  secret: temporal-client-audit-service

migration:
  enabled: true
  database: audit
  user: audit_migrator
  # Mêmes droits que scripts/harden-databases.py : journaux en ajout seul pour le rôle d'exécution.
  grants: |
    REVOKE ALL ON ALL TABLES IN SCHEMA public FROM audit_runtime;
    GRANT SELECT, INSERT, UPDATE (outcome, completed_at, target_subject, requested_changes) ON user_admin_log TO audit_runtime;
    GRANT SELECT, INSERT, UPDATE ON account_revocations TO audit_runtime;
    GRANT SELECT, INSERT ON control_evidence, mission_action_log, program_change_log, finding_change_log TO audit_runtime;
    GRANT SELECT, INSERT, UPDATE, DELETE ON missions, mission_assignments, assignment_outbox, review_workflow_outbox, findings_issue_outbox, mission_risks, mission_controls, mission_control_risks, mission_findings, mission_finding_controls, mission_finding_sequences TO audit_runtime;
