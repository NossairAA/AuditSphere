{{- if gt (int .Values.port) 0 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
    {{- if gt (int .Values.managementPort) 0 }}
    # Port de gestion, pour la sonde blackbox. La règle d'entrée le réserve au namespace monitoring.
    - name: management
      port: {{ .Values.managementPort }}
      targetPort: management
    {{- end }}
{{- end }}
