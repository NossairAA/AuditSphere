apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "spring-service.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        {{- include "spring-service.podSecurity" . | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ include "spring-service.image" . }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER
              value: {{ printf "%s/realms/auditsphere" (required "oidc.origin est obligatoire" .Values.oidc.origin) | quote }}
            - name: OIDC_JWKS
              value: {{ .Values.oidc.jwks | quote }}
            {{- end }}
            {{- include "spring-service.secretEnv" . | nindent 12 }}
          {{- if gt (int .Values.port) 0 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "spring-service.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.internalCa.enabled }}
            - name: internal-ca
              mountPath: /etc/auditsphere/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.internalCa.enabled }}
        - name: internal-ca
          configMap:
            name: {{ .Values.internalCa.configMap }}
        {{- end }}
