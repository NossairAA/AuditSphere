openapi: 3.0.3
info:
  title: AuditSphere Mission API
  version: 0.13.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /missions/owners:
    get:
      summary: Responsables des missions visibles pour alimenter le filtre
      responses:
        '200':
          description: Liste des sujets et noms accessibles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    subject: {type: string}
                    name: {type: string}
        '401': {description: Authentification requise}
  /account/security:
    get:
      summary: Vérifier que le jeton n’a pas été révoqué par une opération administrative
      responses:
        '200': {description: Jeton accepté}
        '401': {description: Jeton expiré ou révoqué}
  /admin/summary:
    get:
      summary: Indicateurs globaux réservés au superadmin
      responses:
        '200':
          description: Toutes les missions non supprimées, en cours, en attente et en retard
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  inProgress: {type: integer}
                  pending: {type: integer}
                  overdue: {type: integer}
                  byStatus:
                    type: object
                    description: Effectifs par statut, missions supprimées exclues, compteurs à zéro inclus
                    required: [DRAFT, IN_PROGRESS, PENDING_REVIEW, APPROVED, CLOSED]
                    properties:
                      DRAFT: {type: integer, minimum: 0}
                      IN_PROGRESS: {type: integer, minimum: 0}
                      PENDING_REVIEW: {type: integer, minimum: 0}
                      APPROVED: {type: integer, minimum: 0}
                      CLOSED: {type: integer, minimum: 0}
        '403': {description: SUPER_ADMIN requis}
  /admin/users:
    get:
      summary: Annuaire paginé réservé au superadmin
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: q, schema: {type: string, maxLength: 200}}
        - {in: query, name: role, schema: {type: string, enum: [SUPER_ADMIN, AUDIT_MANAGER, AUDITOR, AUDIT_VALIDATOR]}}
        - {in: query, name: enabled, schema: {type: boolean}}
      responses:
        '200':
          description: Comptes humains, pagination fixe de 20, identifiant, profil, activation et rôles applicatifs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}
                  total: {type: integer}
                  page: {type: integer}
                  size: {type: integer}
        '403': {description: SUPER_ADMIN requis}
        '503': {description: Annuaire indisponible ou limite de lecture dépassée}
    post:
      summary: Créer un compte et générer un mot de passe temporaire
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserInput'}
      responses:
        '201':
          description: Compte créé, mot de passe à transmettre de façon privée et à changer à la connexion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminActionResult'}
        '400': {description: Profil ou rôle invalide}
        '403': {description: SUPER_ADMIN requis}
        '409': {description: Opération en cours}
        '503': {description: Résultat incertain, vérifier le compte et le journal avant répétition}
  /admin/users/{id}:
    put:
      summary: Modifier le profil et les rôles applicatifs sans changer l'email, puis invalider les sessions
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserInput'}
      responses:
        '200': {description: Modification confirmée}
        '400': {description: Champs invalides ou retrait de son propre accès superadmin}
        '403': {description: SUPER_ADMIN requis}
        '409': {description: Opération en cours}
        '503': {description: Résultat incertain, consulter le journal}
  /admin/users/{id}/reset-password:
    post:
      summary: Envoyer une action de définition du mot de passe par email et fermer les sessions
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Action envoyée par email, réponse sans cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminActionResult'}
        '403': {description: SUPER_ADMIN requis}
        '409': {description: Opération en cours}
        '503': {description: Résultat incertain, consulter le journal}
  /admin/users/{id}/history:
    get:
      summary: Lire les 50 dernières opérations et le nombre de missions actives liées au compte
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Auteur, cible implicite, action, motif, date et résultat, sans secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeMissions: {type: integer}
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        actor_subject: {type: string}
                        action: {type: string, enum: [CREATE, UPDATE, RESET_PASSWORD]}
                        reason: {type: string}
                        requested_changes: {type: string, description: Profil et rôles demandés en JSON, sans mot de passe}
                        outcome: {type: string, enum: [PENDING, SUCCESS, UNCERTAIN]}
                        created_at: {type: string, format: date-time}
        '403': {description: SUPER_ADMIN requis}
  /missions/{id}/controls/{controlId}/evidence:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: controlId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Lister les preuves accessibles du contrôle
      responses:
        '200':
          description: Métadonnées des preuves
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ControlEvidence'}
        '401': {description: Authentification requise}
        '404': {description: Contrôle introuvable ou hors périmètre}
    post:
      summary: Joindre une preuve privée
      description: Auditeur affecté ou SUPER_ADMIN, mission En cours. PDF, JPEG ou PNG de 10 Mio maximum, 100 preuves par contrôle. Version globale incrémentée après dépôt.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, version]
              properties:
                file: {type: string, format: binary}
                version: {type: integer, format: int64, minimum: 0}
      responses:
        '201':
          description: Preuve enregistrée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlEvidence'}
        '400': {description: Nom ou format invalide}
        '401': {description: Authentification requise}
        '403': {description: Dépôt non autorisé}
        '404': {description: Contrôle introuvable ou hors périmètre}
        '409': {description: Version périmée, statut verrouillé ou quota atteint}
        '413': {description: Taille dépassée ou fichier vide}
        '429': {description: Limite de débit atteinte}
        '503': {description: Stockage indisponible}
  /missions/{id}/controls/{controlId}/evidence/{evidenceId}:
    get:
      summary: Télécharger une preuve après vérification des droits sur la mission
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: controlId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: evidenceId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Fichier en pièce jointe, sans cache et avec nosniff
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {description: Authentification requise}
        '404': {description: Preuve introuvable ou hors périmètre}
  /missions/{id}/results:
    put:
      summary: Renseigner ou corriger le résultat d’un contrôle
      description: Auditeur affecté ou SUPER_ADMIN, uniquement En cours. Auteur et date déterminés par le serveur, trace atomique et version de mission obligatoire.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, controlId, outcome, comment]
              properties:
                version: {type: integer, format: int64, minimum: 0}
                controlId: {type: string, format: uuid}
                outcome: {type: string, enum: [CONFORMING, NON_CONFORMING, NOT_APPLICABLE]}
                comment: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '200':
          description: Résultat enregistré et version incrémentée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditProgram'}
        '400': {description: Champs invalides}
        '401': {description: Authentification requise}
        '403': {description: Saisie non autorisée}
        '404': {description: Mission ou contrôle introuvable ou hors périmètre}
        '409': {description: Version périmée ou mission hors statut En cours}
  /missions/{id}/program:
    get:
      summary: Consulter le programme de la mission
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Programme visible, au maximum 100 risques et 100 contrôles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditProgram'}
        '401': {description: Authentification requise}
        '404': {description: Mission introuvable ou non autorisée}
  /missions/{id}/risks:
    put:
      summary: Créer ou modifier un élément du programme
      description: Responsable propriétaire ou SUPER_ADMIN, uniquement en brouillon ou en cours. Sans id crée un élément, avec id modifie un élément existant de cette mission. Version globale de mission obligatoire.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RiskInput'}
      responses:
        '200':
          description: Programme enregistré et version de mission incrémentée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditProgram'}
        '400': {description: Champs invalides ou risques hors mission}
        '401': {description: Authentification requise}
        '403': {description: Écriture non autorisée}
        '404': {description: Mission ou élément introuvable}
        '409': {description: Version périmée, programme verrouillé ou limite de 100 éléments}
  /missions/{id}/controls:
    put:
      summary: Créer ou modifier un élément du programme
      description: Responsable propriétaire ou SUPER_ADMIN, uniquement en brouillon ou en cours. Sans id crée un élément, avec id modifie un élément existant de cette mission. Version globale de mission obligatoire.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlInput'}
      responses:
        '200':
          description: Programme enregistré et version de mission incrémentée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditProgram'}
        '400': {description: Champs invalides ou risques hors mission}
        '401': {description: Authentification requise}
        '403': {description: Écriture non autorisée}
        '404': {description: Mission ou élément introuvable}
        '409': {description: Version périmée, programme verrouillé ou limite de 100 éléments}
  /missions/{id}/override:
    put:
      summary: Dérogation explicite réservée à SUPER_ADMIN
      description: Motif obligatoire, version courante et journal atomique. APPROVE en cours ou en attente, CLOSE sauf brouillon ou déjà clôturée, REOPEN sauf brouillon ou déjà en cours, DELETE sur toute mission active.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, action, reason]
              properties:
                version: {type: integer, format: int64, minimum: 0}
                action: {type: string, enum: [APPROVE, CLOSE, REOPEN, DELETE]}
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Mission modifiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '204': {description: Mission supprimée logiquement}
        '400': {description: Formulaire invalide}
        '401': {description: Authentification requise}
        '403': {description: Rôle SUPER_ADMIN requis}
        '404': {description: Mission absente ou supprimée}
        '409': {description: Version ou statut incompatible}
  /missions/{id}/action-log:
    get:
      summary: Cent dernières entrées du journal, SUPER_ADMIN uniquement
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Journal décroissant, disponible aussi après suppression par identifiant
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  type: object
                  properties:
                    actor_subject: {type: string}
                    action: {type: string}
                    operation: {type: string, nullable: true}
                    reason: {type: string}
                    previous_status: {type: string, nullable: true}
                    resulting_status: {type: string, nullable: true}
                    mission_version: {type: integer, format: int64}
                    occurred_at: {type: string, format: date-time}
        '401': {description: Authentification requise}
        '403': {description: Rôle SUPER_ADMIN requis}
  /missions/titles:
    get:
      summary: Titres des missions accessibles parmi vingt identifiants maximum
      parameters:
        - in: query
          name: ids
          required: true
          style: form
          explode: false
          schema: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Titres par identifiant, missions absentes ou interdites omises
          content:
            application/json:
              schema: {type: object, additionalProperties: {type: string}}
        '400': {description: Identifiants invalides ou trop nombreux}
        '401': {description: Authentification requise}
  /missions:
    get:
      summary: Lister les missions créées, affectées ou désignées pour le validateur courant
      parameters:
        - {in: query, name: q, schema: {type: string, maxLength: 200}, description: Recherche littérale sur titre et périmètre avant pagination}
        - {in: query, name: status, schema: {type: string, enum: [DRAFT, IN_PROGRESS, PENDING_REVIEW, APPROVED, CLOSED]}}
        - {in: query, name: owner, schema: {type: string, maxLength: 255}}
        - {in: query, name: overdue, schema: {type: boolean, default: false}, description: Fin prévue avant la date UTC courante et mission non clôturée}
        - {in: query, name: sort, schema: {type: string, enum: [created, title, end], default: created}}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Liste filtrée côté base, triée par création décroissante puis identifiant
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mission'
                  page: {type: integer}
                  size: {type: integer}
                  total: {type: integer, format: int64}
        '400': {description: Pagination invalide}
        '401': {description: Authentification requise}
    post:
      summary: Créer une mission (AUDIT_MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMission'
      responses:
        '201':
          description: Mission créée, Location contient son URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400': {description: Entrée invalide, validateur inéligible ou identique au propriétaire}
        '401': {description: Authentification absente ou jeton invalide}
        '403': {description: Rôle de création absent}
        '503': {description: Annuaire indisponible pour valider les affectations ou le validateur}
  /missions/{id}:
    get:
      summary: Consulter une mission créée ou affectée à l’utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Mission autorisée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400': {description: Identifiant mal formé}
        '401': {description: Authentification absente ou jeton invalide}
        '404': {description: Mission absente ou inaccessible}
    delete:
      summary: Supprimer un brouillon appartenant au responsable courant, avec journal conservé
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonedAction'}
      responses:
        '204': {description: Brouillon supprimé}
        '400': {description: Version ou motif invalide}
        '401': {description: Authentification requise}
        '403': {description: Rôle responsable ou SUPER_ADMIN requis}
        '404': {description: Mission absente ou autre propriétaire}
        '409': {description: Version obsolète ou statut incompatible}
  /missions/{id}/withdrawal:
    put:
      summary: Retirer une soumission en attente et terminer son cycle Temporal
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonedAction'}
      responses:
        '200':
          description: Mission de nouveau en cours
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '400': {description: Version ou motif invalide}
        '401': {description: Authentification requise}
        '403': {description: Rôle responsable ou SUPER_ADMIN requis}
        '404': {description: Mission absente ou autre propriétaire}
        '409': {description: Version obsolète ou statut incompatible}
  /missions/auditors:
    get:
      summary: Lister une page de 50 membres du rôle AUDITOR, comptes actifs seulement
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Annuaire avec identifiant et nom seulement
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Person'}
        '401': {description: Authentification requise}
        '403': {description: Rôle responsable ou SUPER_ADMIN requis}
        '503': {description: Annuaire indisponible}
  /missions/{id}/assignments:
    put:
      summary: Remplacer les affectations, réservé au propriétaire avec AUDIT_MANAGER
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Assignments'}
      responses:
        '200':
          description: Affectations remplacées atomiquement, liste vide autorisée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '400': {description: Auditeur inconnu, désactivé ou entrée invalide}
        '401': {description: Authentification requise}
        '403': {description: Rôle responsable ou SUPER_ADMIN requis}
        '404': {description: Mission absente ou utilisateur non propriétaire}
        '409': {description: Version périmée, recharger la mission}
        '503': {description: Annuaire indisponible, affectations conservées}
  /missions/{id}/participants:
    get:
      summary: Consulter les noms des participants après contrôle d’accès à la mission
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Responsable, auditeurs et validateur désigné, sans adresse courriel
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Person'}
        '401': {description: Authentification requise}
        '404': {description: Mission absente ou inaccessible}
        '503': {description: Annuaire indisponible}

  /missions/{id}/schedule:
    put:
      summary: Modifier les dates prévues en brouillon ou en cours, uniquement par le responsable propriétaire
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Schedule'}
      responses:
        '200':
          description: Mission mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '400': {description: Version absente, dates invalides ou statut inconnu}
        '401': {description: Authentification requise}
        '403': {description: Rôle responsable ou SUPER_ADMIN requis}
        '404': {description: Mission absente ou utilisateur non propriétaire}
        '409': {description: Version périmée ou opération interdite dans cet état}
  /missions/{id}/status:
    put:
      summary: Démarrer une mission planifiée ou clôturer une mission approuvée
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Transition'}
      responses:
        '200':
          description: Mission mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '400': {description: Version absente, dates invalides ou statut inconnu}
        '401': {description: Authentification requise}
        '403': {description: Rôle responsable ou SUPER_ADMIN requis}
        '404': {description: Mission absente ou utilisateur non propriétaire}
        '409': {description: Version périmée ou opération interdite dans cet état}

  /missions/validators:
    get:
      summary: Lister les validateurs actifs, sans le demandeur (AUDIT_MANAGER)
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Page de 50 comptes au maximum, filtrée après pagination
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Person'}
        '400': {description: Pagination invalide}
        '401': {description: Authentification requise}
        '403': {description: Responsable requis}
        '503': {description: Annuaire indisponible}
  /missions/{id}/validator:
    put:
      summary: Désigner ou retirer le validateur, responsable propriétaire uniquement, en brouillon ou en cours
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, format: int64, minimum: 0}
                validatorSubject: {type: string, nullable: true, minLength: 1, maxLength: 255, description: Sujet Keycloak distinct du propriétaire, null pour retirer}
      responses:
        '200':
          description: Mission actualisée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '400': {description: Compte inactif, rôle absent, auto-désignation ou formulaire invalide}
        '401': {description: Authentification requise}
        '403': {description: Responsable requis}
        '404': {description: Mission absente ou non propriétaire}
        '409': {description: Version périmée ou mission clôturée}
        '503': {description: Annuaire indisponible}
  /missions/{id}/submission:
    put:
      summary: Soumettre une mission en cours au validateur désigné
      description: AUDIT_MANAGER propriétaire. Contrôle de version obligatoire.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Mission actualisée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '400': {description: Formulaire invalide ou validateur inéligible}
        '401': {description: Authentification requise}
        '403': {description: Rôle requis absent}
        '404': {description: Mission absente ou acteur non autorisé}
        '409': {description: Version périmée ou état incompatible}
        '503': {description: Annuaire indisponible à la soumission}
  /missions/{id}/review:
    put:
      summary: Approuver ou demander des corrections
      description: AUDIT_VALIDATOR désigné, distinct du responsable. Contrôle de version obligatoire.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, decision, comment]
              properties:
                version: {type: integer, format: int64, minimum: 0}
                decision: {type: string, enum: [APPROVED, REJECTED]}
                comment: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Mission actualisée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '400': {description: Formulaire invalide ou validateur inéligible}
        '401': {description: Authentification requise}
        '403': {description: Rôle requis absent}
        '404': {description: Mission absente ou acteur non autorisé}
        '409': {description: Version périmée ou état incompatible}
        '503': {description: Annuaire indisponible à la soumission}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    AdminUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        enabled: {type: boolean}
        roles: {type: array, items: {type: string, enum: [SUPER_ADMIN, AUDIT_MANAGER, AUDITOR, AUDIT_VALIDATOR]}}
    AdminUserInput:
      type: object
      required: [firstName, lastName, email, enabled, roles, reason]
      properties:
        username: {type: string, pattern: '^[a-zA-Z0-9._-]{3,80}$', description: Requis à la création, immuable ensuite}
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email, maxLength: 254, description: Requis à la création, immuable ensuite}
        enabled: {type: boolean}
        roles: {type: array, uniqueItems: true, maxItems: 4, items: {type: string, enum: [SUPER_ADMIN, AUDIT_MANAGER, AUDITOR, AUDIT_VALIDATOR]}}
        reason: {type: string, minLength: 1, maxLength: 2000}
    AdminActionResult:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [EMAIL_SENT, LOCAL_ACTION_REQUIRED]}
    ControlEvidence:
      type: object
      required: [id, originalName, mediaType, byteSize, sha256, authorName, createdAt]
      properties:
        id: {type: string, format: uuid}
        originalName: {type: string, maxLength: 255}
        mediaType: {type: string, enum: [application/pdf, image/jpeg, image/png]}
        byteSize: {type: integer, format: int64, minimum: 1, maximum: 10485760}
        sha256: {type: string, minLength: 64, maxLength: 64}
        authorName: {type: string}
        createdAt: {type: string, format: date-time}
    Risk:
      type: object
      required: [id, title, description, probability, impact]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 4000}
        probability: {type: integer, minimum: 1, maximum: 5}
        impact: {type: integer, minimum: 1, maximum: 5}
    RiskInput:
      type: object
      required: [version, title, description, probability, impact]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        id: {type: string, format: uuid, nullable: true}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 4000}
        probability: {type: integer, minimum: 1, maximum: 5}
        impact: {type: integer, minimum: 1, maximum: 5}
    ControlResult:
      type: object
      nullable: true
      required: [outcome, comment, authorSubject, authorName, recordedAt]
      properties:
        outcome: {type: string, enum: [CONFORMING, NON_CONFORMING, NOT_APPLICABLE]}
        comment: {type: string, minLength: 1, maxLength: 4000}
        authorSubject: {type: string}
        authorName: {type: string}
        recordedAt: {type: string, format: date-time}
    Control:
      type: object
      required: [id, objective, procedure, riskIds]
      properties:
        result: {$ref: '#/components/schemas/ControlResult'}
        id: {type: string, format: uuid}
        objective: {type: string, minLength: 1, maxLength: 1000}
        procedure: {type: string, minLength: 1, maxLength: 4000}
        riskIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
    ControlInput:
      type: object
      required: [version, objective, procedure, riskIds]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        id: {type: string, format: uuid, nullable: true}
        objective: {type: string, minLength: 1, maxLength: 1000}
        procedure: {type: string, minLength: 1, maxLength: 4000}
        riskIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
    AuditProgram:
      type: object
      required: [mission, risks, controls]
      properties:
        mission: {$ref: '#/components/schemas/Mission'}
        risks:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Risk'}
        controls:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Control'}
    ReasonedAction:
      type: object
      required: [version, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 2000, description: Motif non blanc}
    Schedule:
      type: object
      required: [version, plannedStartDate, plannedEndDate]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        plannedStartDate: {type: string, format: date}
        plannedEndDate: {type: string, format: date}
    Transition:
      type: object
      required: [version, status]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [IN_PROGRESS, CLOSED]}
    Person:
      type: object
      required: [subject, name]
      properties:
        subject: {type: string}
        name: {type: string}
    Assignments:
      type: object
      required: [version, assigneeSubjects]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        assigneeSubjects:
          type: array
          uniqueItems: true
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 255}
    CreateMission:
      type: object
      required: [title, description, perimeter, assigneeSubjects]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 4000}
        perimeter: {type: string, minLength: 1, maxLength: 2000}
        plannedStartDate: {type: string, format: date, nullable: true, description: Avec plannedEndDate ou toutes deux absentes}
        plannedEndDate: {type: string, format: date, nullable: true, description: Égale ou postérieure au début}
        validatorSubject: {type: string, nullable: true, minLength: 1, maxLength: 255, description: Validateur actif facultatif, distinct du propriétaire}
        assigneeSubjects:
          type: array
          uniqueItems: true
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 255}
    Mission:
      allOf:
        - $ref: '#/components/schemas/CreateMission'
        - type: object
          required: [id, version, status, ownerSubject, createdAt]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, format: int64, minimum: 0}
            status: {type: string, enum: [DRAFT, IN_PROGRESS, PENDING_REVIEW, APPROVED, CLOSED]}
            ownerSubject: {type: string}
            validatorSubject: {type: string, nullable: true}
            submittedAt: {type: string, format: date-time, nullable: true}
            reviewedAt: {type: string, format: date-time, nullable: true}
            reviewedBy: {type: string, nullable: true}
            reviewDecision: {type: string, enum: [APPROVED, REJECTED], nullable: true}
            withdrawnAt: {type: string, format: date-time, nullable: true}
            adminOverrideAction: {type: string, nullable: true}
            adminOverrideReason: {type: string, nullable: true}
            adminOverrideAt: {type: string, format: date-time, nullable: true}
            withdrawalReason: {type: string, nullable: true}
            reviewComment: {type: string, nullable: true}
            createdAt: {type: string, format: date-time}
            startedAt: {type: string, format: date-time, nullable: true}
            closedAt: {type: string, format: date-time, nullable: true}
